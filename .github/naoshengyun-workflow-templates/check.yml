# HISTORICAL INACTIVE TEMPLATE. Do not activate this mutable-tag/PR-trigger copy.
# Controlled CI lives in .github/workflows/naoshengyun-ci.yml and requires
# the independently reviewed activation gates in docs/ci/CNY-CI-ACTIVATION.md.
name: naoshengyun-check
on:
  workflow_dispatch:
  pull_request:
    branches: [naoshengyun]
permissions:
  contents: read
concurrency:
  group: naoshengyun-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:cny
# No commit, push, Pages deployment, release, production credentials or price application.
