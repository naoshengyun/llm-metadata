name: naoshengyun-pages
run-name: CNY Pages from ${{ github.sha }}
on:
  push:
    branches: [naoshengyun]
permissions:
  contents: read
concurrency:
  group: naoshengyun-cny-publication
  cancel-in-progress: false
env:
  PAGES_ORIGIN: https://naoshengyun.github.io/llm-metadata/
jobs:
  build:
    if: github.repository == 'naoshengyun/llm-metadata'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      prior_pointer_hash: ${{ steps.seal.outputs.prior_pointer_hash }}
      site_hash: ${{ steps.seal.outputs.site_hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify active protection and exact human-merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/naoshengyun" > "$RUNNER_TEMP/active-rules.json"
          node scripts/check-cny-rules.mjs "$RUNNER_TEMP/active-rules.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -e --arg sha "$GITHUB_SHA" '
              [.[] | select(.base.ref == "naoshengyun" and .merge_commit_sha == $sha and .merged_at != null)] |
              if length == 1 then .[0].number else error("Expected exactly one merged PR") end
            ' > "$RUNNER_TEMP/pull-number"
          pr="$(cat "$RUNNER_TEMP/pull-number")"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/merged-pr.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .merged and (.merge_commit_sha == $sha) and (.merged_by.type == "User")
          ' "$RUNNER_TEMP/merged-pr.json"
          head_sha="$(jq -er .head.sha "$RUNNER_TEMP/merged-pr.json")"
          test "$(git rev-parse HEAD^2)" = "$head_sha"
          author="$(jq -er .user.login "$RUNNER_TEMP/merged-pr.json")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" |
            jq -e --arg author "$author" --arg head "$head_sha" '
              add | map(select(.user.type == "User" and .user.login != $author and
                (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))) |
              group_by(.user.login) | map(max_by(.id)) |
              any(.[]; .state == "APPROVED" and .commit_id == $head)
            '
      - name: Resolve the last successful Pages deployment
        id: predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r id source; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state')"
            case "$state" in
              success)
                if [ "$source" = "$GITHUB_SHA" ]; then
                  echo "::error::This merge commit already has a successful Pages deployment. Verify its original receipt."
                  exit 1
                fi
                git merge-base --is-ancestor "$source" "$GITHUB_SHA"
                printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              error|failure|inactive) ;;
              *) echo "::error::Prior deployment is unresolved"; exit 1 ;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=30" --jq '.[] | [.id,.sha] | @tsv')
          echo "::error::Cannot identify a verified preceding deployment"
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix web ci --ignore-scripts
      - name: Read the last successful public snapshot for immutable retention
        env:
          PRIOR_SHA: ${{ steps.predecessor.outputs.source }}
        run: node scripts/cny-pages-release.mjs snapshot "$PAGES_ORIGIN" "$RUNNER_TEMP/prior" "$PRIOR_SHA" retain
      - name: Build and regression-test the exact merge commit
        run: |
          set -euo pipefail
          npm run test:cny
          node scripts/build-reviewed-cny.mjs "$RUNNER_TEMP"
          npm --prefix "$RUNNER_TEMP/browser" install --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node scripts/check-unified-site.mjs "$RUNNER_TEMP/site" "$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/browser-evidence"
          test "$(git status --porcelain --untracked-files=all)" = ''
      - name: Retain previously published files and bind the artifact
        id: seal
        run: |
          set -euo pipefail
          node scripts/cny-pages-release.mjs seal "$RUNNER_TEMP/site" "$RUNNER_TEMP/prior" > "$RUNNER_TEMP/publication-receipt.json"
          test "$(jq -er .sourceSha "$RUNNER_TEMP/publication-receipt.json")" = "$GITHUB_SHA"
          jq -r '"site_hash=\(.siteManifestSha256)", "prior_pointer_hash=\(.previousPointerSha256)"' "$RUNNER_TEMP/publication-receipt.json" >> "$GITHUB_OUTPUT"
          tar --directory "$RUNNER_TEMP/site" -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cny-pages-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication-receipt.json
            ${{ runner.temp }}/site/site-manifest.json
            ${{ runner.temp }}/candidate/manifest.json
            ${{ runner.temp }}/browser-evidence
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a stale source or changed public pointer immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_POINTER_HASH: ${{ needs.build.outputs.prior_pointer_hash }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/naoshengyun" --jq .object.sha)" = "$GITHUB_SHA"
          curl --fail --silent --show-error --max-time 30 --header 'Cache-Control: no-cache' \
            "${PAGES_ORIGIN}current.json?cny-release-check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(date +%s)" \
            --output "$RUNNER_TEMP/current.json"
          printf '%s  %s\n' "$PRIOR_POINTER_HASH" "$RUNNER_TEMP/current.json" | sha256sum --check
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  verify-publication:
    if: always() && github.repository == 'naoshengyun/llm-metadata'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record a failed or unconfirmed publication
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$BUILD_RESULT" != success ] || [ "$DEPLOY_RESULT" != success ]; then
            echo "Publication failed or unconfirmed for $GITHUB_SHA (build=$BUILD_RESULT, deploy=$DEPLOY_RESULT)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify the Pages inventory, page, pointer, and all fixed and stable files
        env:
          SITE_HASH: ${{ needs.build.outputs.site_hash }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if receipt="$(timeout 60s node scripts/cny-pages-release.mjs verify "$PAGES_ORIGIN" "$GITHUB_SHA" "$SITE_HASH")"; then
              printf 'Verified public release: `%s`\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 45
          done
          echo "Publication unconfirmed for $GITHUB_SHA. Public read-back never matched the exact artifact." >> "$GITHUB_STEP_SUMMARY"
          exit 1
